<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact — MissMoodyTiger</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Serif+Display:ital@0;1&family=Fraunces:opsz,wght,SOFT@9..144,600..700,50&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header"></header>
    <main class="cart-page contact-page">
      <p class="eyebrow">say hello</p>
      <h1>Contact<br /><em>the studio.</em></h1>
      <p class="contact-intro">For commissions, stockist notes, press, or order support, leave a message below or write directly to <a href="mailto:hello@missmoodytiger.studio">hello@missmoodytiger.studio</a>.</p>
      <form class="contact-form" action="mailto:hello@missmoodytiger.studio" method="post" enctype="text/plain">
        <label for="contactName">name</label><input id="contactName" name="name" autocomplete="name" required />
        <label for="contactEmail">email</label><input id="contactEmail" name="email" type="email" autocomplete="email" required />
        <label for="contactSubject">subject</label><input id="contactSubject" name="subject" required />
        <label for="contactMessage">message</label><textarea id="contactMessage" name="message" rows="6" required></textarea>
        <button type="submit">open email draft →</button>
      </form>
      <p class="detail-note">This form opens your email app; it does not store your message on this website.</p>
    </main>
    <script src="navigation.js?v=2"></script>
  </body>
</html>
